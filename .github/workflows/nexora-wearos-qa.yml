name: NEXORA WearOS QA
on:
  push:
    branches:
      - nexora/wearos-qa-ci-2843
  workflow_dispatch:

jobs:
  wearos-compile:
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile WearOS modules
        run: ./gradlew :play-services-wearable:compileDebugJavaWithJavac :play-services-wearable-core:compileDebugJavaWithJavac --stacktrace --no-daemon
